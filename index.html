<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#2f6fed">
<title>科创区混班选区 · STEM Zone Selection</title>
<style>
:root{
  --primary:#2f6fed;--primary-d:#1d54c4;--soft:#eaf1ff;
  --bg:#f2f5fa;--card:#fff;--ink:#1b2230;--ink2:#5a6577;--muted:#98a1b2;
  --line:#e8edf5;--ok:#17a673;--warn:#f08c00;--danger:#e03131;
  --r:14px;--sh:0 1px 2px rgba(24,39,75,.05),0 4px 14px rgba(24,39,75,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:linear-gradient(120deg,#2f6fed 0%,#5b9bff 100%);
  color:#fff;box-shadow:0 2px 12px rgba(47,111,237,.28);
}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16.5px;letter-spacing:.3px;min-width:0}
.brand i{font-style:normal;font-size:19px}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chip{
  background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:12px;
  display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(4px);white-space:nowrap;
}
.chip.adm{background:rgba(255,255,255,.92);color:var(--primary);font-weight:600}
.lang-btn{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);
  color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);flex:0 0 auto;letter-spacing:-.2px;
}
.lang-btn:active{background:rgba(255,255,255,.4)}

/* ---------- 主体 ---------- */
.view{padding:12px 12px calc(80px + env(safe-area-inset-bottom,0px));max-width:1120px;margin:0 auto}
.sec-title{font-size:13px;color:var(--muted);margin:4px 4px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec-title b{color:var(--ink);font-size:14px;font-weight:600}

/* ---------- 区域卡片 ---------- */
.zone-grid{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:600px){.zone-grid{grid-template-columns:1fr 1fr}}
@media(min-width:920px){.zone-grid{grid-template-columns:repeat(3,1fr)}}
.zcard{
  background:var(--card);border-radius:var(--r);padding:12px 13px 11px;
  box-shadow:var(--sh);border:1px solid rgba(232,237,245,.9);
  transition:transform .12s ease,box-shadow .12s ease;position:relative;overflow:hidden;
}
.zcard:active{transform:scale(.985)}
.zcard.full::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.35);pointer-events:none}
.zc-head{display:flex;align-items:flex-start;gap:10px}
.zc-icon{
  width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;
}
.zc-title{min-width:0;flex:1}
.zc-name{font-weight:600;font-size:15.5px;line-height:1.3;word-break:break-all}
.zc-sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 8px}
.zc-sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.zc-body{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.grow{display:flex;align-items:center;gap:8px}
.gtag{
  font-size:11px;font-weight:600;padding:1.5px 7px;border-radius:6px;flex:0 0 auto;
  background:var(--soft);color:var(--primary);
}
.gtag.big{background:#fff3e0;color:#e8590c}
.gnum{font-size:12px;color:var(--ink2);flex:0 0 auto;font-variant-numeric:tabular-nums}
.gnum b{font-size:13.5px;color:var(--ink)}
.gnum .left{color:var(--ok);font-weight:600}
.gnum .left.zero{color:var(--danger)}
.sqs{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:13px}
.sq{width:12px;height:12px;border-radius:3.5px;border:1.6px solid #cdd6e4;background:#fff;display:block}
.sq.on{background:var(--primary);border-color:var(--primary)}
.sq.on.big{background:#f7941e;border-color:#f7941e}
.na{font-size:11.5px;color:var(--muted)}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--muted);transition:color .15s}
.tab i{font-size:19px;font-style:normal;line-height:1}
.tab.active{color:var(--primary);font-weight:600}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(232,237,245,.9);padding:14px;margin-bottom:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:10px;font-size:14.5px;font-weight:600;
  background:var(--primary);color:#fff;transition:opacity .15s;
}
.btn:active{opacity:.82}
.btn.block{width:100%}
.btn.ghost{background:var(--soft);color:var(--primary)}
.btn.gray{background:#eef1f6;color:var(--ink2)}
.btn.danger{background:#ffecec;color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;pointer-events:none}
.input{
  width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:#fafbfd;outline:none;transition:border-color .15s,background .15s;
}
.input:focus{border-color:var(--primary);background:#fff}
.label{font-size:12.5px;color:var(--ink2);margin:0 0 6px 2px;font-weight:500}

/* 返回条 */
.backbar{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:14px;color:var(--ink2)}
.backbar button{display:flex;align-items:center;gap:4px;color:var(--primary);font-weight:600;padding:4px 0}

/* 详情页 */
.detail-head{display:flex;gap:12px;align-items:center}
.detail-icon{width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:30px}
.detail-name{font-size:19px;font-weight:700;line-height:1.25}
.detail-meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}

/* 分段控件 */
.seg{display:flex;background:#eef1f6;border-radius:11px;padding:3px;gap:3px;margin:14px 0 12px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);transition:.18s}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(24,39,75,.1)}

/* 名额大格 */
.bigsq{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 12px}
.bigsq .sq{width:22px;height:22px;border-radius:6px;border-width:2px}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#f8fafd;border-radius:10px;padding:9px 10px;text-align:center;border:1px solid var(--line)}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:11.5px;color:var(--muted);margin-top:1px}
.stat.ok .v{color:var(--ok)}.stat.warn .v{color:var(--warn)}.stat.dg .v{color:var(--danger)}

/* 班级配额 */
.cls-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:520px){.cls-grid{grid-template-columns:repeat(3,1fr)}}
.cls-item{display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:#f8fafd;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12.5px}
.cls-item .n{color:var(--ink2)}
.cls-item .c{font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary)}
.cls-item.over .c{color:#f7941e}
.cls-item.free .c{color:var(--ok)}

/* 名单 */
.name-list{display:flex;flex-direction:column;gap:7px}
.name-item{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#f8fafd;
  border:1px solid var(--line);border-radius:10px}
.name-item .who{font-weight:600;font-size:14.5px}
.name-item .cls{font-size:11.5px;color:var(--primary);background:var(--soft);padding:1.5px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.name-item .acts{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(18,26,42,.5);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .16s ease}
@media(min-width:600px){.mask{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@media(min-width:600px){.sheet{border-radius:18px;margin:0 16px}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-title{font-size:17px;font-weight:700;margin:0 0 4px;text-align:center}
.sheet-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:14px}
.sheet-foot{display:flex;gap:10px;margin-top:16px}
.sheet-foot .btn{flex:1}
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fafbfd;
  font-size:13.5px;font-weight:600;color:var(--ink2);transition:.15s;text-align:center}
.opt.on{border-color:var(--primary);background:var(--soft);color:var(--primary)}
.opt:disabled{opacity:.38}

/* 语言选择 */
.lang-list{display:flex;flex-direction:column;gap:8px}
.lang-opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:#fafbfd;transition:.15s;text-align:left;width:100%}
.lang-opt.on{border-color:var(--primary);background:var(--soft)}
.lang-opt .flag{font-size:22px}
.lang-opt .nm{font-weight:600;font-size:15px;color:var(--ink)}
.lang-opt .sub{font-size:12px;color:var(--muted);margin-top:1px}
.lang-opt .tick{margin-left:auto;color:var(--primary);font-weight:700;font-size:16px}

/* 提示 */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(20,28,44,.9);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;
  z-index:999;opacity:0;pointer-events:none;transition:.2s;max-width:78vw;text-align:center;line-height:1.45}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.ok{background:rgba(23,166,115,.94)}
.toast.err{background:rgba(224,49,49,.94)}

/* 搜索 */
.searchbar{position:relative;margin-bottom:12px}
.searchbar .input{padding-left:38px}
.searchbar .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.result-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;
  border-bottom:1px solid var(--line)}
.result-row:first-child{border-radius:12px 12px 0 0}
.result-row:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.result-row .rn{font-weight:600;min-width:56px}
.result-row .rz{font-size:12px;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-row .rc{font-size:11.5px;color:var(--primary);background:var(--soft);padding:2px 7px;border-radius:6px;font-weight:600;flex:0 0 auto;white-space:nowrap}
.result-box{border-radius:12px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(232,237,245,.9)}
mark{background:#fff3bf;color:inherit;border-radius:3px;padding:0 1px}

/* 管理 */
.mrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{font-weight:600;font-size:14.5px}
.mrow .mt div{font-size:12px;color:var(--muted);margin-top:1px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><i>🔬</i><span id="brandText">科创区混班选区</span></div>
  <div class="topbar-right" id="topRight"></div>
</div>

<main class="view" id="view"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab active" data-route="zones"><i>🏫</i><span id="tab1">活动区域</span></button>
  <button class="tab" data-route="search"><i>🔍</i><span id="tab2">全部名单</span></button>
  <button class="tab" data-route="admin"><i>⚙️</i><span id="tab3">管理</span></button>

<div id="modalRoot"></div>

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const classesOf = g => g==='mid'?MID_CLASSES:BIG_CLASSES;

function t(key, ...args){
  const pack = I18N[state.lang] || I18N['zh-CN'];
  let s = pack[key] != null ? pack[key] : (I18N['zh-CN'][key] != null ? I18N['zh-CN'][key] : key);
  args.forEach((v,i)=>{ s = s.replace('{' + i + '}', v); });
  return s;
}
function gradeName(g){
  return g==='mid' ? t('mid') : t('big');
}
function dispZone(name){
  if(state.lang==='en') return ZONE_EN[name] || name;
  if(state.lang==='zh-HK') return ZONE_TC[name] || name;
  return name;
}
function dispSite(site){
  if(!site) return t('siteTbd');
  if(state.lang==='en') return SITE_EN[site] || site;
  if(state.lang==='zh-HK') return SITE_TC[site] || site;
  return site;
}
function dispClass(cls){
  if(state.lang==='en') return CLASS_EN[cls] || cls;
  return cls;
}
function dispOwner(owner){
  return owner || t('ownerTbd');
}

function toast(msg, type){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className='toast'; }, 2200);
}

/* 名额规则 */
function canSignup(zone, grade, className, records){
  const total = grade==='mid' ? zone.midTotal : zone.bigTotal;
  if(total <= 0) return { ok:false, msg:t('notOpenGradeMsg', gradeName(grade)) };
  const list = records.filter(r=>r.zoneId===zone._id && r.grade===grade);
  if(list.length >= total) return { ok:false, msg:t('full') };
  const my = list.filter(r=>r.className===className).length;
  if(total < 6){
    if(my >= 1) return { ok:false, msg:t('smallClassFull') };
    return { ok:true };
  }
  const base = Math.floor(total/6);
  if(my < base) return { ok:true, reserved:true };
  return { ok:true, reserved:false };
}

const Store = {
  mode:'local', app:null, db:null, watcher:null,
  bc: (typeof BroadcastChannel!=='undefined') ? new BroadcastChannel('scq_sync') : null,

  async init(){
    if(CFG.envId){
      try{
        await this.loadSdk();
        this.app = cloudbase.init({ env: CFG.envId });
        const auth = this.app.auth({ persistence:'local' });
        if(typeof auth.signInAnonymously === 'function') await auth.signInAnonymously();
        else if(auth.anonymousAuthProvider) await auth.anonymousAuthProvider().signIn();
        this.db = this.app.database();
        this.mode = 'cloud';
        return true;
      }catch(e){
        console.warn('[SCQ] 云开发初始化失败，降级本机模式：', e);
        toast(t('envFail'));
      }
    }
    this.mode = 'local';
    this._seedLocal();
    return false;
  },

  loadSdk(){
    if(window.cloudbase) return Promise.resolve();
    return new Promise((resolve,reject)=>{
      let i = 0;
      const tryLoad = ()=>{
        if(i >= SDK_URLS.length) return reject(new Error('SDK 加载失败'));
        const s = document.createElement('script');
        s.src = SDK_URLS[i++];
        s.onload = ()=> window.cloudbase ? resolve() : tryLoad();
        s.onerror = tryLoad;
        document.head.appendChild(s);
      };
      tryLoad();
    });
  },

  _LSKEY:'scq_local_db_v1',
  _readLocal(){
    try{ return JSON.parse(localStorage.getItem(this._LSKEY)) }catch(e){ return null }
  },
  _writeLocal(d){
    localStorage.setItem(this._LSKEY, JSON.stringify(d));
    if(this.bc) this.bc.postMessage({ type:'changed' });
  },
  _seedLocal(){
    let d = this._readLocal();
    if(!d || !d.zones || !d.zones.length){
      d = {
        zones: JSON.parse(JSON.stringify(DEFAULT_ZONES)),
        records: [], admins: [],
        config: { pass:'888888', invite:'inv-'+Math.random().toString(36).slice(2,8) }
      };
      this._writeLocal(d);
    }
    d.zones.forEach(z=>{ z.owner = z.owner || ''; });
    this._local = d;
  },

  async fetchAll(){
    if(this.mode === 'local'){
      const d = this._readLocal() || this._local;
      this._local = d;
      return { zones:d.zones, records:d.records, admins:d.admins, config:d.config };
    }
    const db = this.db;
    const [z, r, a, c] = await Promise.all([
      db.collection('scq_zones').orderBy('order','asc').limit(100).get(),
      db.collection('scq_records').limit(1000).get(),
      db.collection('scq_admins').limit(20).get(),
      db.collection('scq_config').doc('main').get().catch(()=>({data:null})),
    ]);
    return {
      zones: z.data || [], records: r.data || [], admins: a.data || [],
      config: c.data || { pass:'888888', invite:'' }
    };
  },

  startWatch(onChange){
    if(this.mode === 'local'){
      this.bc && (this.bc.onmessage = ()=> onChange());
      window.addEventListener('storage', e=>{ if(e.key===this._LSKEY) onChange(); });
      setInterval(onChange, 15000);
      return;
    }
    const pull = ()=> this.fetchAll().then(d=>onChange(d)).catch(()=>{});
    try{
      this.watcher = this.db.collection('scq_records').limit(1000)
        .watch({ onChange: ()=> pull(), onError: err=> console.warn('[watch]', err) });
      this.db.collection('scq_zones').limit(100).watch({ onChange: ()=> pull(), onError: ()=>{} });
    }catch(e){
      console.warn('watch 不可用，改用轮询', e);
      setInterval(pull, 8000);
    }
  },

  async call(action, payload){
    if(this.mode === 'cloud'){
      const res = await this.app.callFunction({ name: CFG.fnName, data: { action, ...payload } });
      const r = res && res.result;
      if(!r) throw new Error('云函数无返回');
      if(r.ok === false) throw new Error(r.msg || '操作失败');
      return r;
    }
    return this._localCall(action, payload);
  },

  _localCall(action, p){
    const d = this._readLocal() || this._local;
    const uid = p.uid;
    const isAdm = d.admins.some(a=>a.uid === uid);
    const now = Date.now();
    const findZone = id => d.zones.find(z=>z._id===id);
    const gradeRecs = (zoneId, grade)=> d.records.filter(r=>r.zoneId===zoneId && r.grade===grade);

    switch(action){
      case 'signup': {
        const zone = findZone(p.zoneId);
        if(!zone) throw new Error(t('zoneNotExist'));
        const name = (p.childName||'').trim();
        if(!name) throw new Error(t('fillName'));
        if(!classesOf(p.grade).includes(p.className)) throw new Error(t('badClass'));
        if(d.records.some(r=>r.zoneId===p.zoneId && r.grade===p.grade && r.childName===name))
          throw new Error(t('alreadySignup'));
        const chk = canSignup(zone, p.grade, p.className, d.records);
        if(!chk.ok) throw new Error(chk.msg);
        d.records.push({
          _id:'r'+now+Math.random().toString(36).slice(2,6),
          zoneId:p.zoneId, grade:p.grade, className:p.className,
          childName:name, uid, createdAt:now, updatedAt:now
        });
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      case 'updateRecord': {
        const rec = d.records.find(r=>r._id===p.id);
        if(!rec) throw new Error(t('recordNotExist'));
        if(rec.uid !== uid && !isAdm) throw new Error(t('onlyOwn'));
        const name = (p.childName||'').trim();
        if(!name) throw new Error(t('fillName'));
        if(d.records.some(r=>r._id!==p.id && r.zoneId===rec.zoneId && r.grade===rec.grade && r.childName===name))
          throw new Error(t('alreadySignup'));
        rec.childName = name; rec.updatedAt = now;
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      case 'deleteRecord': {
        const idx = d.records.findIndex(r=>r._id===p.id);
        if(idx < 0) throw new Error(t('recordNotExist'));
        if(d.records[idx].uid !== uid && !isAdm) throw new Error(t('onlyOwnDel'));
        d.records.splice(idx,1);
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      case 'saveZone': {
        if(!isAdm) throw new Error(t('needAdmin'));
        const z = findZone(p.id);
        if(!z) throw new Error(t('zoneNotExist'));
        const patch = p.patch || {};
        const mid = Number(patch.midTotal), big = Number(patch.bigTotal);
        if(!(mid>=0) || !(big>=0)) throw new Error(t('quotaNeg'));
        const midUsed = gradeRecs(z._id,'mid').length;
        const bigUsed = gradeRecs(z._id,'big').length;
        if(mid < midUsed) throw new Error(t('midLessThanUsed', midUsed));
        if(big < bigUsed) throw new Error(t('bigLessThanUsed', bigUsed));
        Object.assign(z, {
          name:(patch.name||z.name).trim() || z.name,
          site:(patch.site||'').trim(),
          owner:(patch.owner||'').trim(),
          icon:(patch.icon||z.icon).trim() || '📦',
          midTotal:mid, bigTotal:big
        });
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      case 'grantAdmin': {
        if(!isAdm){
          if(d.admins.length > 0) throw new Error(t('needAdmin'));
          if((p.pass||'') !== (d.config.pass||'888888')) throw new Error(t('wrongPass'));
        }
        if(d.admins.some(a=>a.uid===uid)) return { ok:true };
        if(d.admins.length >= MAX_ADMIN) throw new Error(t('adminMaxReached', MAX_ADMIN));
        d.admins.push({ _id:uid, uid, name:(p.name||'').trim()||'Admin', createdAt:now });
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      case 'revokeAdmin': {
        if(!isAdm) throw new Error(t('needAdmin'));
        d.admins = d.admins.filter(a=>a.uid !== p.targetUid);
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      case 'clearAll': {
        if(!isAdm) throw new Error(t('needAdmin'));
        d.records = [];
        this._writeLocal(d); this._local = d;
        return { ok:true };
      }
      default: throw new Error('Unknown action: '+action);
    }
  }
};

/* =========================================================================
   七、派生数据
   ========================================================================= */
function zoneRecords(zoneId, grade){
  return state.records.filter(r=>r.zoneId===zoneId && (!grade || r.grade===grade));
}
function squares(total, used, big){
  if(total <= 0) return '<span class="na">'+t('notOpen')+'</span>';
  let s = '';
  for(let i=0;i<total;i++) s += '<i class="sq'+(i<used?' on':'')+(big?' big':'')+'"></i>';
  return s;
}

/* =========================================================================
   八、视图：区域列表
   ========================================================================= */
function viewZones(){
  const totalCap = state.zones.reduce((a,z)=>a+z.midTotal+z.bigTotal,0);
  const totalUsed = state.records.length;

  const cards = state.zones.map(z=>{
    const mU = zoneRecords(z._id,'mid').length;
    const bU = zoneRecords(z._id,'big').length;
    const mLeft = Math.max(0, z.midTotal - mU);
    const bLeft = Math.max(0, z.bigTotal - bU);
    const full = (z.midTotal>0 && mLeft===0) && (z.bigTotal>0 && bLeft===0);
    return `
    <div class="zcard${full?' full':''}" data-zone="${z._id}">
      <div class="zc-head">
        <div class="zc-icon">${esc(z.icon)}</div>
        <div class="zc-title">
          <div class="zc-name">${esc(dispZone(z.name))}</div>
          <div class="zc-sub">
            <span>📍 ${esc(dispSite(z.site))}</span>
            <span>👤 ${esc(dispOwner(z.owner))}</span>
          </div>
        </div>
      </div>
      <div class="zc-body">
        <div class="grow">
          <span class="gtag">${t('mid')}</span>
          <span class="gnum"><b>${mU}</b>/${z.midTotal} · ${t('leftShort')} <span class="left${mLeft===0?' zero':''}">${mLeft}</span></span>
        </div>
        <div class="sqs">${squares(z.midTotal, mU, false)}</div>
        <div class="grow">
          <span class="gtag big">${t('big')}</span>
          <span class="gnum"><b>${bU}</b>/${z.bigTotal} · ${t('leftShort')} <span class="left${bLeft===0?' zero':''}">${bLeft}</span></span>
        </div>
        <div class="sqs">${squares(z.bigTotal, bU, true)}</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="sec-title">
    <b>${t('zonesTotal', state.zones.length)}</b>
    <span>${t('signedCount', totalUsed, totalCap)}</span>
  </div>
  <div class="zone-grid">${cards}</div>`;
}

/* =========================================================================
   九、视图：区域详情
   ========================================================================= */
function viewDetail(){
  const z = state.zones.find(x=>x._id===state.zoneId);
  if(!z) return '<div class="empty">'+t('zoneNotExist')+'</div>';
  const g = state.grade;
  const total = g==='mid' ? z.midTotal : z.bigTotal;
  const recs = zoneRecords(z._id, g);
  const left = Math.max(0, total - recs.length);
  const clsList = classesOf(g);
  const base = total >= 6 ? Math.floor(total/6) : 1;

  const clsHtml = clsList.map(c=>{
    const n = recs.filter(r=>r.className===c).length;
    let clsName = 'cls-item', cCls = '';
    if(total < 6){ clsName += n>=1?' over':(n===0?' free':''); cCls = n+'/1'; }
    else { clsName += n>base?' over':(n<base?' free':''); cCls = n+'/'+base; }
    return `<div class="${clsName}"><span class="n">${esc(dispClass(c))}</span><span class="c">${cCls}</span></div>`;
  }).join('');

  const listHtml = recs.length ? recs
    .slice().sort((a,b)=> clsList.indexOf(a.className)-clsList.indexOf(b.className) || a.createdAt-b.createdAt)
    .map(r=>{
      const mine = r.uid === state.me.uid;
      const canEdit = mine || state.me.isAdmin;
      return `
      <div class="name-item">
        <span class="cls">${esc(dispClass(r.className))}</span>
        <span class="who">${esc(r.childName)}</span>
        ${canEdit ? `<span class="acts">
          ${mine?`<button class="icon-btn" data-edit="${r._id}" title="edit">✏️</button>`:''}
          <button class="icon-btn" data-del="${r._id}" title="delete">🗑️</button>
        </span>` : ''}
      </div>`;
    }).join('') : '<div class="empty">'+t('noSignup')+'</div>';

  const rule = total <= 0 ? t('ruleNotOpen')
    : total < 6 ? t('ruleSmall', total)
    : t('ruleBig', total, base, total-base*6);

  const fullMid = z.midTotal>0 && zoneRecords(z._id,'mid').length>=z.midTotal;
  const fullBig = z.bigTotal>0 && zoneRecords(z._id,'big').length>=z.bigTotal;
  const isFull = g==='mid' ? fullMid : fullBig;

  return `
  <div class="backbar">
    <button data-back="1">${t('back')}</button>
  </div>

  <div class="card">
    <div class="detail-head">
      <div class="detail-icon">${esc(z.icon)}</div>
      <div style="min-width:0">
        <div class="detail-name">${esc(dispZone(z.name))}</div>
        <div class="detail-meta">
          <span>📍 ${esc(dispSite(z.site))}</span>
          <span>👤 ${t('ownerPrefix')}${esc(dispOwner(z.owner))}</span>
        </div>
      </div>
    </div>

    <div class="seg">
      <button class="${g==='mid'?'on':''}" data-grade="mid">${t('mid')} ${zoneRecords(z._id,'mid').length}/${z.midTotal}</button>
      <button class="${g==='big'?'on':''}" data-grade="big">${t('big')} ${zoneRecords(z._id,'big').length}/${z.bigTotal}</button>
    </div>

    ${total<=0 ? '<div class="empty">'+t('notOpenGrade')+'</div>' : `
    <div class="bigsq">${squares(total, recs.length, g==='big')}</div>
    <div class="stat-row">
      <div class="stat"><div class="v">${total}</div><div class="k">${t('total')}</div></div>
      <div class="stat warn"><div class="v">${recs.length}</div><div class="k">${t('signed')}</div></div>
      <div class="stat ${left===0?'dg':'ok'}"><div class="v">${left}</div><div class="k">${t('remaining')}</div></div>
    </div>`}

    <button class="btn block" id="btnSignup" ${isFull||total<=0?'disabled':''}>
      ${total<=0 ? t('btnNotOpen') : (isFull ? t('btnFull') : t('btnSignup'))}
    </button>
    <div class="hint">💡 ${rule}</div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin:0 0 10px"><b>${t('classPerf')}</b><span>${t('classPerfSub')}</span></div>
    <div class="cls-grid">${clsHtml}</div>
  </div>

  <div class="card">
    <div class="sec-title" style="margin:0 0 10px"><b>${t('gradeListTitle', gradeName(g))}</b><span>${t('gradeListSub', recs.length)}</span></div>
    <div class="name-list">${listHtml}</div>
  </div>`;
}

/* =========================================================================
   十、视图：全部名单与查找
   ========================================================================= */
function viewSearch(){
  const kw = state.keyword.trim();
  let list = state.records.slice();

  if(kw){
    const k = kw.toLowerCase();
    list = list.filter(r=>{
      const n = (r.childName||'').toLowerCase();
      const c = (r.className||'').toLowerCase();
      const ce = (CLASS_EN[r.className]||'').toLowerCase();
      return n.includes(k) || c.includes(k) || ce.includes(k);
    });
  }
  list.sort((a,b)=>
    (a.className||'').localeCompare(b.className||'','zh') ||
    (a.childName||'').localeCompare(b.childName||'','zh')
  );

  const rows = list.map(r=>{
    const z = state.zones.find(x=>x._id===r.zoneId) || {};
    const hl = s => kw ? esc(s).replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`) : esc(s);
    return `<div class="result-row" data-goto="${r.zoneId}">
      <span class="rn">${hl(r.childName)}</span>
      <span class="rc">${esc(dispClass(r.className))}</span>
      <span class="rz">${esc(z.icon||'')} ${esc(dispZone(z.name||''))} · ${esc(dispSite(z.site))} · ${esc(dispOwner(z.owner))}</span>
    </div>`;
  }).join('');

  const byCls = {};
  state.records.forEach(r=>{ byCls[r.className] = (byCls[r.className]||0)+1; });
  const clsSummary = [...MID_CLASSES, ...BIG_CLASSES]
    .filter(c=>byCls[c]).map(c=>`<div class="cls-item"><span class="n">${esc(dispClass(c))}</span><span class="c">${byCls[c]} ${t('peopleUnit')}</span></div>`).join('');

  return `
  <div class="searchbar">
    <span class="ico">🔍</span>
    <input class="input" id="kwInput" placeholder="${esc(t('searchPh'))}" value="${esc(state.keyword)}">
  </div>
  <div class="sec-title"><b>${kw?t('searchResults'):t('allLists')}</b><span>${t('countUnit', list.length)}</span></div>
  ${list.length ? `<div class="result-box">${rows}</div>` : '<div class="empty">'+t('noMatch')+'</div>'}
  ${!kw && clsSummary ? `<div class="card" style="margin-top:14px">
    <div class="sec-title" style="margin:0 0 10px"><b>${t('classOverview')}</b></div>
    <div class="cls-grid">${clsSummary}</div>
  </div>` : ''}
  <div class="hint" style="text-align:center;margin-top:14px">${t('privacyFooter')}</div>`;
}

/* =========================================================================
   十二、渲染
   ========================================================================= */
function render(){
  // 更新静态文案
  document.title = t('appTitle');
  $('#brandText').textContent = t('appTitle');
  $('#tab1').textContent = t('tabZones');
  $('#tab2').textContent = t('tabSearch');
  $('#tab3').textContent = t('tabAdmin');

  const map = { zones:viewZones, detail:viewDetail, search:viewSearch, admin:viewAdmin };
  const fn = map[state.route] || viewZones;
  $('#view').innerHTML = fn();

  const totalLeft = state.zones.reduce((a,z)=>a + Math.max(0,z.midTotal-zoneRecords(z._id,'mid').length)
                                            + Math.max(0,z.bigTotal-zoneRecords(z._id,'big').length), 0);
  const langShort = state.lang==='zh-CN' ? '简' : state.lang==='en' ? 'EN' : '繁';
  $('#topRight').innerHTML =
    `<button class="lang-btn" id="btnLang" title="${esc(t('langTitle'))}">${langShort}</button>` +
    `<span class="chip">${t('chipLeft')} ${totalLeft}</span>` +
    (state.me.isAdmin ? `<span class="chip adm">${t('chipAdmin')}</span>` : '');

  $$('#tabbar .tab').forEach(b=>{
    const r = b.dataset.route;
    b.classList.toggle('active', r===state.route || (state.route==='detail' && r==='zones'));
  });

  const kwInput = $('#kwInput');
  if(kwInput){
    kwInput.addEventListener('input', e=>{
      state.keyword = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = $('#kwInput'); if(el){ el.focus(); el.setSelectionRange(pos,pos); }
    });
  }
}

  openModal(`
    <div class="sheet-title">${t('langTitle')}</div>
    <div class="sheet-sub">${t('langSub')}</div>
    <div class="lang-list">
      ${langs.map(l=>`
        <button class="lang-opt${state.lang===l.code?' on':''}" data-lang="${l.code}">
          <span class="flag">${l.flag}</span>
          <span style="min-width:0">
            <div class="nm">${esc(l.name)}</div>
            <div class="sub">${esc(l.sub)}</div>
          </span>
          ${state.lang===l.code?'<span class="tick">✓</span>':''}
        </button>`).join('')}
    </div>
    <div class="sheet-foot">
      <button class="btn gray" data-close="1">${t('cancel')}</button>
    </div>`);

  $$('#modalRoot [data-lang]').forEach(b=>{
    b.onclick = ()=>{
      state.lang = b.dataset.lang;
      localStorage.setItem('scq_lang', state.lang);
      document.documentElement.lang = state.lang==='en' ? 'en' : (state.lang==='zh-HK' ? 'zh-HK' : 'zh-CN');
      closeModal();
      render();
    };
  });
}

/* 报名弹窗 */
function openSignup(zoneId, grade){
  const zone = state.zones.find(z=>z._id===zoneId);
  if(!zone) return;
  let g = grade || 'mid';
  let cls = '';
  let name = '';

  const build = ()=>{
    const total = g==='mid' ? zone.midTotal : zone.bigTotal;
    const recs = zoneRecords(zone._id, g);
    const left = Math.max(0, total - recs.length);
    const base = total >= 6 ? Math.floor(total/6) : 1;
    const list = classesOf(g);

    const opts = list.map(c=>{
      const n = recs.filter(r=>r.className===c).length;
      const disabled = total < 6 ? n>=1 : (total - recs.length<=0 && n>=base);
      const mark = total < 6 ? `(${n}/1)` : `(${n}/${base})`;
      return `<button class="opt${cls===c?' on':''}" data-cls="${c}" ${disabled?'disabled':''}>${esc(dispClass(c))}<br><span style="font-size:10.5px;font-weight:400;color:#98a1b2">${mark}</span></button>`;
    }).join('');

    return `
      <div class="sheet-title">${t('signupTitle', esc(dispZone(zone.name)))}</div>
      <div class="sheet-sub">${t('signupSub', esc(dispSite(zone.site)), left, total)}</div>

      <div class="label">${t('chooseGrade')}</div>
      <div class="seg" style="margin:0 0 14px">
        <button class="${g==='mid'?'on':''}" data-g="mid">${t('mid')}</button>
        <button class="${g==='big'?'on':''}" data-g="big">${t('big')}</button>
      </div>

      <div class="label">${t('chooseClass')}</div>
      <div class="opt-grid">${opts}</div>

      <div class="label" style="margin-top:14px">${t('childNameLabel')}</div>
      <input class="input" id="childName" maxlength="10" placeholder="${esc(t('childNamePh'))}" value="${esc(name)}">

      <div class="hint">${
        total <= 0 ? t('ruleNotOpen')
        : total < 6 ? t('ruleSmall', total)
        : t('ruleBig', total, base, total-base*6)
      }</div>

      <div class="sheet-foot">
        <button class="btn gray" data-close="1">${t('cancel')}</button>
        <button class="btn" id="btnSubmit">${t('confirmSignup')}</button>
      </div>`;
  };

  const refresh = ()=>{ openModal(build()); bind(); };
  const bind = ()=>{
    $$('#modalRoot [data-g]').forEach(b=> b.onclick = ()=>{ g = b.dataset.g; cls=''; refresh(); });
    $$('#modalRoot [data-cls]').forEach(b=> b.onclick = ()=>{
      if(b.disabled) return;
      cls = b.dataset.cls;
      name = $('#childName') ? $('#childName').value : name;
      refresh();
      const el = $('#childName'); if(el) el.focus();
    });
    const cn = $('#childName');
    if(cn){
      cn.oninput = e=>{ name = e.target.value; };
      if(cls) cn.focus();
    }
    $('#btnSubmit').onclick = async ()=>{
      name = ($('#childName')||{}).value || name;
      if(!cls) return toast(t('selectClass'),'err');
      if(!name.trim()) return toast(t('fillName'),'err');
      const btn = $('#btnSubmit');
      btn.disabled = true; btn.textContent = t('submitting');
      try{
        await Store.call('signup', {
          zoneId:zone._id, grade:g, className:cls, childName:name.trim(), uid:state.me.uid
        });
        closeModal();
        toast(t('signupOk'),'ok');
        await reload();
      }catch(e){
        toast(e.message || t('signupFail'),'err');
        btn.disabled = false; btn.textContent = t('confirmSignup');
        await reload();
      }
    };
  };

  openModal(build());
  bind();
}

/* 修改记录弹窗 */
function openEditRecord(id){
  const r = state.records.find(x=>x._id===id);
  if(!r) return;
  openModal(`
    <div class="sheet-title">${t('editRecordTitle')}</div>
    <div class="sheet-sub">${esc(dispClass(r.className))}</div>
    <div class="label">${t('childNameLabel')}</div>
    <input class="input" id="editName" maxlength="10" value="${esc(r.childName)}">
    <div class="sheet-foot">
      <button class="btn gray" data-close="1">${t('cancel')}</button>
      <button class="btn" id="btnEditSave">${t('save')}</button>
    </div>`);
  $('#btnEditSave').onclick = async ()=>{
    const v = ($('#editName').value||'').trim();
    if(!v) return toast(t('fillName'),'err');
    try{
      await Store.call('updateRecord', { id, childName:v, uid:state.me.uid });
      closeModal(); toast(t('saved'),'ok'); await reload();
    }catch(e){ toast(e.message,'err'); }
  };
}

/* 区域编辑弹窗 */
function openZoneEdit(zoneId){
  const z = state.zones.find(x=>x._id===zoneId);
  if(!z) return;
  const icons = ['🧱','🪚','🏺','⛰️','👗','🌿','🛤️','💡','🏖️','⚙️','🤖','📄','🌾','🔔','🔧','🎎','🔬','🁣','🧰','🏝️','💧','🖨️','🧩','🥟','🧲','📦','🎨','🧪','🔭','🪁'];
  openModal(`
    <div class="sheet-title">${t('editZoneTitle')}</div>
    <div class="sheet-sub">${t('editZoneSub')}</div>

    <div class="label">${t('zoneIconLabel')}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <input class="input" id="zIcon" style="width:70px;text-align:center;font-size:22px" maxlength="2" value="${esc(z.icon)}">
      <div style="display:flex;flex-wrap:wrap;gap:5px;flex:1">
        ${icons.map(i=>`<button class="opt" style="padding:4px 7px;font-size:16px;min-width:34px" data-icon="${i}">${i}</button>`).join('')}
      </div>
    </div>

    <div class="label">${t('zoneNameLabel')}</div>
    <input class="input" id="zName" maxlength="20" value="${esc(z.name)}">

    <div class="label" style="margin-top:12px">${t('zoneSiteLabel')}</div>
    <input class="input" id="zSite" maxlength="20" placeholder="${esc(t('zoneSitePh'))}" value="${esc(z.site)}">

    <div class="label" style="margin-top:12px">${t('zoneOwnerLabel')}</div>
    <input class="input" id="zOwner" maxlength="12" placeholder="${esc(t('zoneOwnerPh'))}" value="${esc(z.owner)}">

    <div style="display:flex;gap:10px;margin-top:12px">
      <div style="flex:1">
        <div class="label">${t('midQuota')}</div>
        <input class="input" id="zMid" type="number" min="0" max="60" value="${z.midTotal}">
      </div>
      <div style="flex:1">
        <div class="label">${t('bigQuota')}</div>
        <input class="input" id="zBig" type="number" min="0" max="60" value="${z.bigTotal}">
      </div>
    </div>
    <div class="hint">${t('quotaHint', zoneRecords(z._id,'mid').length, zoneRecords(z._id,'big').length)}</div>

    <div class="sheet-foot">
      <button class="btn gray" data-close="1">${t('cancel')}</button>
      <button class="btn" id="btnZoneSave">${t('save')}</button>
    </div>`);

  $$('#modalRoot [data-icon]').forEach(b=> b.onclick = ()=>{ $('#zIcon').value = b.dataset.icon; });
  $('#btnZoneSave').onclick = async ()=>{
    try{
      await Store.call('saveZone', {
        id: zoneId, uid: state.me.uid,
        patch:{
          icon: $('#zIcon').value.trim(),
          name: $('#zName').value.trim(),
          site: $('#zSite').value.trim(),
          owner: $('#zOwner').value.trim(),
          midTotal: Number($('#zMid').value),
          bigTotal: Number($('#zBig').value),
        }
      });
      closeModal(); toast(t('saved'),'ok'); await reload();
    }catch(e){ toast(e.message,'err'); }
  };
}

/* =========================================================================
   十四、事件绑定
   ========================================================================= */
document.addEventListener('click', async e=>{
  const t2 = e.target;

  if(t2.closest('[data-mask]') && (!t2.closest('.sheet') || t2.closest('[data-close]'))){
    if(t2.closest('[data-close]') || t2.classList.contains('mask')) { closeModal(); return; }
  }
  if(t2.closest('[data-close]')){ closeModal(); return; }

  // 语言按钮
  if(t2.closest('#btnLang')){ openLangPicker(); return; }

  // 底部导航
  const tab = t2.closest('#tabbar .tab');
  if(tab){ state.route = tab.dataset.route; state.zoneId = null; render(); window.scrollTo(0,0); return; }

  // 区域卡片
  const zc = t2.closest('[data-zone]');
  if(zc){ state.zoneId = zc.dataset.zone; state.route='detail'; state.grade='mid'; render(); window.scrollTo(0,0); return; }

  // 返回
  if(t2.closest('[data-back]')){ state.route='zones'; state.zoneId=null; render(); return; }

  // 年级切换
  const gb = t2.closest('[data-grade]');
  if(gb){ state.grade = gb.dataset.grade; render(); return; }

  // 报名按钮
  if(t2.closest('#btnSignup')){ openSignup(state.zoneId, state.grade); return; }

  // 修改 / 删除记录
  const ed = t2.closest('[data-edit]');
  if(ed){ openEditRecord(ed.dataset.edit); return; }
  const dl = t2.closest('[data-del]');
  if(dl){
    const rec = state.records.find(r=>r._id===dl.dataset.del);
    if(!rec) return;
    if(!confirm(t('confirmDelete', dispClass(rec.className), rec.childName))) return;
    try{
      await Store.call('deleteRecord', { id:rec._id, uid:state.me.uid });
      toast(t('deleted'),'ok'); await reload();
    }catch(err){ toast(err.message,'err'); }
    return;
  }

  // 搜索结果跳转
  const go = t2.closest('[data-goto]');
  if(go){ state.zoneId = go.dataset.goto; state.route='detail'; render(); window.scrollTo(0,0); return; }

  // 管理员登录
  if(t2.closest('#btnLogin')){
    const pass = ($('#passInput')||{}).value || '';
    const nm = ($('#nameInput')||{}).value || '';
    try{
      await Store.call('grantAdmin', { uid:state.me.uid, pass, name:nm });
      toast(t('gotAdmin'),'ok');
      await reload();
    }catch(err){ toast(err.message,'err'); }
    return;
  }
  // 退出管理员
  if(t2.closest('#btnLogout')){
    if(!confirm(t('logoutConfirm'))) return;
    try{ await Store.call('revokeAdmin', { uid:state.me.uid, targetUid:state.me.uid }); toast(t('loggedOut'),'ok'); await reload(); }
    catch(err){ toast(err.message,'err'); }
    return;
  }
  // 移除其他管理员
  const ad = t2.closest('[data-admdel]');
  if(ad){
    if(!confirm(t('removeAdmin'))) return;
    try{ await Store.call('revokeAdmin', { uid:state.me.uid, targetUid:ad.dataset.admdel }); toast(t('removed'),'ok'); await reload(); }
    catch(err){ toast(err.message,'err'); }
    return;
  }
  // 编辑区域
  const ze = t2.closest('[data-zedit]');
  if(ze){ openZoneEdit(ze.dataset.zedit); return; }
  // 复制邀请链接
  if(t2.closest('#btnCopyInvite')){
    const v = ($('#inviteUrl')||{}).value || '';
    try{
      await navigator.clipboard.writeText(v);
      toast(t('copied'),'ok');
    }catch(_){
      const el = $('#inviteUrl'); el.select(); document.execCommand('copy'); toast(t('copied'),'ok');
    }
    return;
  }
  // 保存云环境 ID
  if(t2.closest('#btnSaveEnv')){
    const v = ($('#envInput').value||'').trim();
    localStorage.setItem('scq_env', v);
    toast(t('envSaved'),'ok');
    setTimeout(()=>location.reload(), 800);
    return;
  }
  // 一键清空
  if(t2.closest('#btnClearAll')){
    const r1 = confirm(t('clearConfirm1'));
    if(!r1) return;
    const txt = prompt(t('clearConfirm2'));
    if(txt !== t('clearWord')){ toast(t('clearCancel'),'err'); return; }
    try{
      await Store.call('clearAll', { uid:state.me.uid });
      toast(t('cleared'),'ok'); await reload();
    }catch(err){ toast(err.message,'err'); }
    return;
  }
});

/* =========================================================================
   十五、数据加载
   ========================================================================= */
async function reload(){
  try{
    const d = await Store.fetchAll();
    state.zones = (d.zones||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    state.records = d.records || [];
    state.admins = d.admins || [];
    state.config = d.config || {};
    state.me.isAdmin = state.admins.some(a=>a.uid === state.me.uid);
    state.ready = true;
    render();
  }catch(e){
    console.error(e);
    toast('Load failed: ' + (e.message||''),'err');
  }
}

/* =========================================================================
   十六、启动
   ========================================================================= */
(async function boot(){
  document.documentElement.lang = state.lang==='en' ? 'en' : (state.lang==='zh-HK' ? 'zh-HK' : 'zh-CN');
  $('#view').innerHTML = '<div class="empty">Loading…</div>';

  const url = new URL(location.href);
  const inviteToken = url.searchParams.get('admin');
  const langParam = url.searchParams.get('lang');
  if(langParam && I18N[langParam]){
    state.lang = langParam;
    localStorage.setItem('scq_lang', state.lang);
    url.searchParams.delete('lang');
  }

  await Store.init();

  if(inviteToken){
    try{
      const cfg = (Store.mode==='cloud' ? (await Store.fetchAll()).config : (Store._readLocal()||{}).config) || {};
      if(cfg.invite === inviteToken) await Store.call('grantAdmin', { uid:state.me.uid, invite:inviteToken });
    }catch(e){}
    url.searchParams.delete('admin');
    history.replaceState({}, '', url.pathname + (url.searchParams.toString()?'?'+url.searchParams:''));
  }

  await reload();
  Store.startWatch(()=> reload());
})();
</script>
